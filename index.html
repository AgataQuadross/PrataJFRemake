<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Conta - Prata JF</title>
    <script src="https://kit.fontawesome.com/7d729e43cb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>

    <main class="container-login">
        <section class="cartao-login">
            <div class="logo-login">
                <img src="assets/img/PRATA_JF_LOGO_100px.png" alt="Logo Prata JF">
            </div>

            <h1>Entrar na Conta</h1>

            <form action="principal.html" method="GET">
                <div class="grupo-formulario">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                </div>

                <div class="grupo-formulario">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha">
                </div>

                <div class="caixa-selecao">
                    <input type="checkbox" name="lembrar" id="lembrar">
                    <label for="lembrar">Lembrar de mim</label>
                </div>

                <button type="submit" class="botao-enviar">Entrar</button>
            </form>

            <div class="links-login">
                <a href="recuperacao.html">Esqueceu a senha?</a>
                <a href="cadastro.html" class="link-destaque">Ainda não tem uma conta? Cadastre-se</a>
                <a href="principal.html" class="link-voltar"><i class="fa-solid fa-arrow-left"></i> Continuar navegando na loja</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Todos os direitos reservados.</p>
    </footer>

</body>

</html>
