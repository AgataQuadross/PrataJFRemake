    <link rel="stylesheet" href="assets/css/style.css">

<body>
    <nav>
        <a href="principal.html"><img src="assets/img/PRATA_JF_LOGO_100px.png" alt="logo/botão de retorno, Prata jf"></a>
        <button class="botao-hamburguer" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="navegador">
            <li><a href="principal.html" title="Voltar para a Loja"><i class="fa-solid fa-arrow-left-long"></i></a></li>
            <li><a href="historia.html" title="Nossa História"><i class="fa-regular fa-newspaper"></i></a></li>
            <li><a href="conta.html" title="Minha Conta"><i class="fa-regular fa-user"></i></a></li>
            <li><a href="localizacao.html" title="Nossas Lojas"><i class="fa-solid fa-location-dot"></i></a></li>
            <li><a href="carrinho.html" class="link-carrinho" title="Ver Carrinho"><i class="fa-solid fa-cart-shopping"></i><span class="contador-carrinho" id="cart-count" style="display: none;">0</span></a></li>
        </ul>
    </nav>
    <header class="cabecalho-carrossel">
        <img src="assets/img/stackcolaresbg.png" alt="Colares Prata JF" class="foto-carrossel ativa">
        <img src="assets/img/stackpulseiras.jpg" alt="Pulseiras Prata JF" class="foto-carrossel">
        <img src="assets/img/stackanelbg.jpg" alt="Anéis Prata JF" class="foto-carrossel">
        <img src="assets/img/fotofundooriginal.jpg" alt="Fundo Prata JF" class="foto-carrossel">
    </header>

    <main>
         <section class="meio">
            <img src="assets/img/bordinha-removebg-preview.png" alt="bordinha topo">
        </section>
        <div class="meio">
            <div class="col-lg-3">
                <h2 class="text-center">Você tem alguma pergunta?</h2>
                <p>www.pratajf.com.br</p>
                <p>Ligue para nós:</p>
                <p>Mister -> (21) 96994-0029</p>
                <p>Halfeld -> (21) 96963-2627</p>
                <p>E-mail:
                    <a href="mailto:contato@pratajf.com.br">contato@pratajf.com.br</a>
                </p>
            </div>
            <div class="col-lg-5">
                <form method="post" class="grupo-formulario">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" class="campo-formulario" id="nome" placeholder="Nome completo"
                        required="">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" class="campo-formulario" id="email" placeholder="Email de contato"
                        required="">
                    <label for="assunto">Assunto</label>
                    <input type="text" name="assunto" class="campo-formulario" id="assunto" placeholder="Titulo"
                        required="">
                    <label for="conteudo">Conteúdo</label>
                    <textarea name="conteudo" class="campo-formulario" id="conteudo" placeholder="Mensagem"
                        required=""></textarea>
                    <button type="submit" class="botao-enviar-contato">Enviar</button>
                </form>
            </div>
        </div>
         <section class="meio">
            <img src="assets/img/bordinha-removebg-preview.png" alt="bordinha topo">
        </section>
    </main>

    <footer>
        <section class="redes">
            <p>&copy Todos os direitos reservados</p>
            <h3>Redes Sociais</h3>
            <ul>
                <li>
                    <a href="https://www.instagram.com/pratajf.oficial" target="_blank">Instagram</a>
                </li>
                <li>
                    <a href="https://www.facebook.com/pratajf.oficial" target="_blank">Facebook</a>
                </li>
                <li>
                    <a href="https://www.youtube.com/playlist?list=PLc6GkUJNMFSdrMxr_dEmtDWNnuEGLCmPq"
                        target="_blank">Youtube</a>
                </li>
            </ul>
        </section>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/funcionalidades.js"></script>
    <script src="assets/js/carrossel.js"></script>
</body>

</html>
