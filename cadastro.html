<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Prata JF</title>
    <script src="https://kit.fontawesome.com/7d729e43cb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>

    <main class="container-login">
        <section class="cartao-login">
            <div class="logo-login">
                <img src="assets/img/PRATA_JF_LOGO_100px.png" alt="Logo Prata JF">
            </div>

            <h1>Criar Conta</h1>

            <form action="principal.html" method="GET">
                <div class="grupo-formulario">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Seu nome completo">
                    <small class="mensagem-erro" id="erro-nome"></small>
                </div>

                <div class="grupo-formulario">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                    <small class="mensagem-erro" id="erro-email"></small>
                </div>

                <div class="grupo-formulario">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required minlength="6" placeholder="Crie uma senha segura">
                    <small class="mensagem-erro" id="erro-senha"></small>
                </div>

                <div class="grupo-formulario">
                    <label for="confirma_senha">Confirmar Senha</label>
                    <input type="password" id="confirma_senha" name="confirma_senha" required
                        placeholder="Repita a senha">
                    <small class="mensagem-erro" id="erro-confirma-senha"></small>
                </div>

                <div class="caixa-selecao">
                    <input type="checkbox" name="termos" id="termos" required>
                    <label for="termos">Li e concordo com os termos de uso</label>
                </div>

                <button type="submit" class="botao-enviar">Cadastrar</button>
            </form>

            <div class="links-login">
                <a href="index.html" class="link-destaque">Já possui uma conta? Entrar</a>
                <a href="principal.html" class="link-voltar"><i class="fa-solid fa-arrow-left"></i> Continuar navegando
                    na loja</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Todos os direitos reservados.</p>
    </footer>

    <script src="assets/js/validacao.js"></script>

</body>

</html>
