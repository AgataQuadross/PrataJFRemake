<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Favoritos - Prata JF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/7d729e43cb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/favoritos.css">
</head>

<body>
    <nav>
        <a href="principal.html"><img src="assets/img/PRATA_JF_LOGO_100px.png" alt="logo/botão de retorno, Prata jf"></a>
        <button class="botao-hamburguer" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="navegador">
            <li><a href="principal.html" title="Voltar para a Loja"><i class="fa-solid fa-arrow-left-long"></i></a></li>
            <li><a href="historia.html" title="Nossa História"><i class="fa-regular fa-newspaper"></i></a></li>
            <li><a href="conta.html" title="Minha Conta"><i class="fa-regular fa-user"></i></a></li>
            <li><a href="contato.html" title="Contato"><i class="fa-solid fa-phone"></i></a></li>
            <li><a href="localizacao.html" title="Nossas Lojas"><i class="fa-solid fa-location-dot"></i></a></li>
            <li><a href="carrinho.html" class="link-carrinho" title="Ver Carrinho"><i class="fa-solid fa-cart-shopping"></i><span class="contador-carrinho" id="cart-count" style="display: none;">0</span></a></li>
        </ul>
    </nav>

    <header class="cabecalho-carrossel">
        <img src="assets/img/stackcolaresbg.png" alt="Colares Prata JF" class="foto-carrossel ativa">
        <img src="assets/img/stackpulseiras.jpg" alt="Pulseiras Prata JF" class="foto-carrossel">
        <img src="assets/img/stackanelbg.jpg" alt="Anéis Prata JF" class="foto-carrossel">
        <img src="assets/img/fotofundooriginal.jpg" alt="Fundo Prata JF" class="foto-carrossel">
    </header>

    <main>
        <section class="meio">
            <img src="assets/img/bordinha-removebg-preview.png" alt="bordinha topo">
        </section>

        <section class="container-favoritos">
            <div class="cabecalho-favoritos">
                <h1><i class="fa-regular fa-heart"></i> Meus Favoritos</h1>
                <span class="contador-favoritos-badge" id="contador-favoritos-total">0 itens salvos</span>
            </div>

            <!-- Grade com os cards favoritados -->
            <div id="grade-favoritos" class="grade-favoritos">
                <!-- Itens inseridos dinamicamente por favoritos.js -->
            </div>

            <!-- Mensagem caso não tenha nenhum favorito -->
            <div id="favoritos-vazio" class="favoritos-vazio" style="display: none;">
                <div class="icone-vazio-favoritos">
                    <i class="fa-regular fa-heart"></i>
                </div>
                <h2>Sua lista de favoritos está vazia</h2>
                <p>Navegue pela nossa loja e clique no ícone de coração para salvar suas joias e peças favoritas!</p>
                <a href="principal.html" class="botao-explorar-loja">
                    <i class="fa-solid fa-gem"></i> Explorar Joias em Prata 925
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/funcionalidades.js"></script>
    <script src="assets/js/carrossel.js"></script>
    <script src="assets/js/favoritos.js"></script>
</body>

</html>
