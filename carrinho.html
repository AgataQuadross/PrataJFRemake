<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Prata JF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/7d729e43cb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/carrinho.css">
</head>

<body>
    <nav>
        <a href="principal.html"><img src="assets/img/PRATA_JF_LOGO_100px.png" alt="logo/botão de retorno, Prata jf"></a>
        <button class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="navegador">
            <li><a href="principal.html"><i class="fa-solid fa-arrow-left-long"></i></a></li>
            <li><a href="historia.html"><i class="fa-regular fa-newspaper"></i></a></li>
            <li><a href="conta.html"><i class="fa-regular fa-user"></i></a></li>
            <li><a href="contato.html"><i class="fa-solid fa-phone"></i></a></li>
            <li><a href="localizacao.html"><i class="fa-solid fa-location-dot"></i></a></li>
        </ul>
    </nav>

    <header class="header-carrossel">
        <img src="assets/img/stackcolaresbg.png" alt="Colares Prata JF" class="foto-carrossel ativa">
        <img src="assets/img/stackpulseiras.jpg" alt="Pulseiras Prata JF" class="foto-carrossel">
        <img src="assets/img/stackanelbg.jpg" alt="Anéis Prata JF" class="foto-carrossel">
        <img src="assets/img/fotofundooriginal.jpg" alt="Fundo Prata JF" class="foto-carrossel">
    </header>

    <main>
        <section class="carrinho-container">
            <h2>Carrinho de Compras</h2>

            <!-- Mensagem se estiver vazio -->
            <div id="carrinho-vazio" style="display: none;">
                <p>Seu carrinho está vazio.</p>
                <a href="principal.html">Voltar para a Loja</a>
            </div>

            <!-- Tabela quando tiver produtos -->
            <div id="carrinho-conteudo">
                <table class="tabela-carrinho">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Subtotal</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="itens-carrinho">
                        <!-- Itens carregados via JS -->
                    </tbody>
                </table>

                <div class="resumo-carrinho">
                    <h3>Total: <span id="valor-total">R$ 0,00</span></h3>
                    <button class="btn-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <section class="redes">
            <p>&copy Todos os direitos reservados</p>
            <h3>Redes Sociais</h3>
            <ul>
                <li>
                    <a href="https://www.instagram.com/pratajf.oficial" target="_blank">Instagram</a>
                </li>
                <li>
                    <a href="https://www.facebook.com/pratajf.oficial" target="_blank">Facebook</a>
                </li>
                <li>
                    <a href="https://www.youtube.com/playlist?list=PLc6GkUJNMFSdrMxr_dEmtDWNnuEGLCmPq"
                        target="_blank">Youtube</a>
                </li>
            </ul>
        </section>
    </footer>

    <script src="assets/js/funcionalidades.js"></script>
    <script src="assets/js/carrinho.js"></script>
    <script src="assets/js/carrossel.js"></script>
</body>

</html>
