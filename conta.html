<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - Prata JF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/7d729e43cb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/conta.css">
</head>

<body>
    <nav>
        <a href="principal.html"><img src="assets/img/PRATA_JF_LOGO_100px.png"
                alt="logo/botão de retorno, Prata jf"></a>
        <button class="botao-hamburguer" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="navegador">
            <li><a href="principal.html" title="Voltar para a Loja"><i class="fa-solid fa-arrow-left-long"></i></a></li>
            <li><a href="historia.html"><i class="fa-regular fa-newspaper"></i></a></li>
            <li><a href="conta.html"><i class="fa-regular fa-user"></i></a></li>
            <li><a href="contato.html"><i class="fa-solid fa-phone"></i></a></li>
            <li><a href="localizacao.html"><i class="fa-solid fa-location-dot"></i></a></li>
            <li><a href="carrinho.html" class="link-carrinho" title="Ver Carrinho"><i
                        class="fa-solid fa-cart-shopping"></i><span class="contador-carrinho" id="cart-count"
                        style="display: none;">0</span></a></li>
        </ul>
    </nav>

    <main>
        <section class="meio">
            <img src="assets/img/bordinha-removebg-preview.png" alt="bordinha topo">
        </section>

        <div class="container-conta">
            <aside class="painel-lateral">
                <div class="perfil-usuario">
                    <div class="avatar">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <div class="info-usuario">
                        <h2>Minha Conta</h2>
                        <p>Meu Perfil</p>
                    </div>
                </div>

                <nav class="navegacao-conta">
                    <a href="#compras" class="item-navegacao ativo">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span>Minhas Compras</span>
                    </a>
                </nav>
            </aside>

            <section class="conteudo-conta">
                <div class="secao-pedidos" id="compras">
                    <h2>Minhas Compras</h2>

                    <div class="status-grid">
                        <div class="status-card">
                            <i class="fa-regular fa-credit-card" style="font-size: 1.5rem;"></i>
                            <span>A pagar</span>
                        </div>

                        <div class="status-card">
                            <i class="fa-solid fa-box" style="font-size: 1.5rem;"></i>
                            <span>Preparando</span>
                        </div>

                        <div class="status-card">
                            <i class="fa-solid fa-truck" style="font-size: 1.5rem;"></i>
                            <span>A caminho</span>
                        </div>

                        <div class="status-card">
                            <i class="fa-regular fa-star" style="font-size: 1.5rem;"></i>
                            <span>A avaliar</span>
                        </div>
                    </div>
                </div>

                <div class="secao-gerenciamento" id="gerenciamento">
                    <h2>Gerenciamento</h2>

                    <div class="grade-status" style="margin-bottom: 20px;">
                        <div class="status-card">
                            <i class="fa-regular fa-heart" style="font-size: 1.5rem;"></i>
                            <span>Favoritos</span>
                        </div>
                        <div class="status-card">
                            <i class="fa-solid fa-ticket" style="font-size: 1.5rem;"></i>
                            <span>Cupons</span>
                        </div>
                    </div>

                    <div class="lista-gerenciamento">
                        <a href="#" class="item-gerenciamento">
                            <strong>Editar Perfil</strong>
                            <small>Endereços, nome e e-mail</small>
                        </a>
                        <a href="#" class="item-gerenciamento">
                            <strong>Segurança da Conta</strong>
                            <small>Alterar senha e autenticação</small>
                        </a>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/funcionalidades.js"></script>
    <script src="assets/js/carrossel.js"></script>
</body>

</html>
