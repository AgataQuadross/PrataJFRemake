<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - Prata JF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/7d729e43cb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/conta.css">
</head>

<body>
    <nav>
        <a href="principal.html"><img src="assets/img/PRATA_JF_LOGO_100px.png"
                alt="logo/botão de retorno, Prata jf"></a>
        <button class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="navegador">
            <li><a href="historia.html"><i class="fa-regular fa-newspaper"></i></a></li>
            <li><a href="conta.html"><i class="fa-regular fa-user"></i></a></li>
            <li><a href="contato.html"><i class="fa-solid fa-phone"></i></a></li>
            <li><a href="localizacao.html"><i class="fa-solid fa-location-dot"></i></a></li>
            <li><a href="carrinho.html" class="link-carrinho" title="Ver Carrinho"><i
                        class="fa-solid fa-cart-shopping"></i><span class="carrinho-contador" id="cart-count"
                        style="display: none;">0</span></a></li>
        </ul>
    </nav>

    <main class="account-container">
        <aside class="account-sidebar">
            <div class="user-profile">
                <div class="avatar-placeholder">
                    <i class="fa-regular fa-user"></i>
                </div>
                <div class="user-info">
                    <h2>Minha Conta</h2>
                    <p>Meu Perfil</p>
                </div>
            </div>

            <nav class="account-nav">
                <a href="#compras" class="nav-item active">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Minhas Compras</span>
                </a>
            </nav>
        </aside>

        <section class="account-content">
            <div class="orders-section" id="compras">
                <h2>Minhas Compras</h2>
                
                <div class="status-grid">
                    <div class="status-card">
                        <i class="fa-regular fa-credit-card" style="font-size: 1.5rem;"></i>
                        <span>A pagar</span>
                    </div>

                    <div class="status-card">
                        <i class="fa-solid fa-box" style="font-size: 1.5rem;"></i>
                        <span>Preparando</span>
                    </div>

                    <div class="status-card">
                        <i class="fa-solid fa-truck" style="font-size: 1.5rem;"></i>
                        <span>A caminho</span>
                    </div>

                    <div class="status-card">
                        <i class="fa-regular fa-star" style="font-size: 1.5rem;"></i>
                        <span>A avaliar</span>
                    </div>
                </div>
            </div>

            <div class="management-section" id="gerenciamento">
                <h2>Gerenciamento</h2>

                <div class="status-grid" style="margin-bottom: 20px;">
                    <div class="status-card">
                        <i class="fa-regular fa-heart" style="font-size: 1.5rem;"></i>
                        <span>Favoritos</span>
                    </div>
                    <div class="status-card">
                        <i class="fa-solid fa-ticket" style="font-size: 1.5rem;"></i>
                        <span>Cupons</span>
                    </div>
                </div>

                <div class="management-list">
                    <a href="#" class="management-item">
                        <strong>Editar Perfil</strong>
                        <small>Endereços, nome e e-mail</small>
                    </a>
                    <a href="#" class="management-item">
                        <strong>Segurança da Conta</strong>
                        <small>Alterar senha e autenticação</small>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const menuToggle = document.querySelector('.mobile-menu-toggle');
        const navMenu = document.querySelector('.header-icons');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });
    </script>
    <script src="assets/js/funcionalidades.js"></script>
    <script src="assets/js/carrossel.js"></script>
</body>

</html>
