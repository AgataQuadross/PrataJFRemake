                    <div class="seletor-qtd">

                        <input type="number" id="modal-qtd" value="1" min="1" max="99" readonly>
                        <button type="button" id="btn-modal-mais" title="Aumentar quantidade">+</button>
                    </div>
                </div>

                <div class="modal-acoes">
